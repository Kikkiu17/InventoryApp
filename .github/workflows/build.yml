name: Multi-Platform Build (Android, Linux, Windows)

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: './Flutter App'

      - name: Build APK
        run: flutter build apk --release
        working-directory: './Flutter App'

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Inventario-Android-APK
          path: Flutter App/build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libcurl4-openssl-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build AppImage
        run: bash AppImage/build_appimage.sh

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Inventario-Linux-AppImage
          path: AppImage/*.AppImage

  build-windows:
    name: Build Windows Single Executable Setup
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: './Flutter App'

      - name: Build Windows Executable
        run: flutter build windows --release
        working-directory: './Flutter App'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Windows Single Setup EXE
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "Flutter App/windows/installer.iss"

      - name: Upload Windows Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: Inventario-Windows-Setup-EXE
          path: build_output/Inventario-Windows-x64-Setup.exe

  create-release:
    name: Upload Release Assets
    needs: [build-apk, build-linux, build-windows]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Inventario-Android-APK
          path: release_assets/

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: Inventario-Linux-AppImage
          path: release_assets/

      - name: Download Windows Setup EXE
        uses: actions/download-artifact@v4
        with:
          name: Inventario-Windows-Setup-EXE
          path: release_assets/

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
