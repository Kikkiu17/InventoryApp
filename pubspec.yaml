name: inventario
description: App per la gestione dell'inventario dei componenti nei cassetti

publish_to: 'none'
version: 1.1.8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  uuid: ^4.3.3
  flutter_slidable: ^4.0.3
  provider: ^6.1.2
  http: ^1.6.0
  pdf: ^3.11.3
  open_filex: ^4.7.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
      - assets/fonts/Roboto-Regular.ttf

flutter_launcher_icons:
  android: true
  linux: true
  image_path: "assets/icon.png"